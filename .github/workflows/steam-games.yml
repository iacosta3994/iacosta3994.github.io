name: Steam games

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch most played games
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python .github/scripts/update_steam_games.py
      - name: Commit games.json when it changed
        run: |
          git diff --quiet -- games.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update most played Steam games."
          git push
